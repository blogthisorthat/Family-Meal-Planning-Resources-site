<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Lemon Herb Salmon Sheet Pan Dinner</title>
  <desc id="desc">Illustrated sheet pan with roasted salmon, baby potatoes, asparagus, red peppers, lemon slices and fresh herbs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ead7"/><stop offset="1" stop-color="#d9c4a3"/></linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454545"/><stop offset="1" stop-color="#202020"/></linearGradient>
    <linearGradient id="salmon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb06f"/><stop offset="0.55" stop-color="#ed764e"/><stop offset="1" stop-color="#c94d37"/></linearGradient>
    <radialGradient id="potato"><stop offset="0" stop-color="#ffd972"/><stop offset="1" stop-color="#b96a27"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".26"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="600" cy="600" rx="490" ry="42" fill="#7f6447" opacity=".28" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <rect x="105" y="72" width="990" height="530" rx="36" fill="url(#pan)"/>
    <rect x="137" y="104" width="926" height="466" rx="24" fill="#30302e" stroke="#666" stroke-width="5"/>
  </g>
  <!-- asparagus -->
  <g stroke-linecap="round">
    <g stroke="#346c31" stroke-width="18">
      <path d="M780 150 L900 500"/><path d="M820 145 L940 492"/><path d="M860 142 L980 480"/><path d="M900 152 L1015 466"/>
    </g>
    <g fill="#6d9d46">
      <path d="M770 145 l13-31 18 27z"/><path d="M810 141 l13-31 19 27z"/><path d="M850 138 l14-31 18 27z"/><path d="M890 148 l14-31 18 27z"/>
    </g>
  </g>
  <!-- salmon fillets -->
  <g transform="rotate(-7 540 330)">
    <rect x="320" y="185" width="230" height="300" rx="42" fill="url(#salmon)" stroke="#b84735" stroke-width="5"/>
    <rect x="560" y="175" width="225" height="305" rx="42" fill="url(#salmon)" stroke="#b84735" stroke-width="5"/>
    <g stroke="#ffd1a2" stroke-width="7" opacity=".75" fill="none">
      <path d="M350 250 q80 30 165 0"/><path d="M350 305 q80 30 165 0"/><path d="M350 360 q80 30 165 0"/><path d="M590 245 q75 28 160 0"/><path d="M590 300 q75 28 160 0"/><path d="M590 355 q75 28 160 0"/>
    </g>
  </g>
  <!-- potatoes -->
  <g fill="url(#potato)" stroke="#9c5424" stroke-width="4">
    <circle cx="205" cy="180" r="38"/><circle cx="245" cy="270" r="34"/><circle cx="190" cy="365" r="39"/><circle cx="265" cy="450" r="37"/><circle cx="980" cy="190" r="35"/><circle cx="1020" cy="280" r="37"/><circle cx="1005" cy="382" r="35"/><circle cx="945" cy="510" r="38"/><circle cx="170" cy="500" r="32"/>
  </g>
  <g stroke="#f7e0a2" stroke-width="5" opacity=".75"><path d="M180 180h50M205 155v50"/><path d="M220 270h50"/><path d="M165 365h50"/><path d="M240 450h50"/><path d="M955 190h50"/><path d="M995 280h50"/></g>
  <!-- red pepper strips -->
  <g fill="none" stroke="#d33f35" stroke-width="20" stroke-linecap="round">
    <path d="M155 225 q70 40 115 15"/><path d="M165 420 q58-35 105-15"/><path d="M900 240 q65-45 120-10"/><path d="M890 440 q62 35 125 5"/>
  </g>
  <!-- lemon slices -->
  <g stroke="#f8e285" stroke-width="10" fill="#fff7b3">
    <circle cx="430" cy="225" r="54"/><circle cx="675" cy="392" r="56"/><circle cx="780" cy="170" r="46"/>
  </g>
  <g stroke="#e8bf36" stroke-width="4" fill="none">
    <path d="M430 175v100M380 225h100M394 189l72 72M466 189l-72 72"/>
    <path d="M675 336v112M619 392h112M636 353l78 78M714 353l-78 78"/>
    <path d="M780 124v92M734 170h92M748 138l64 64M812 138l-64 64"/>
  </g>
  <!-- herbs -->
  <g fill="#2e7c45">
    <circle cx="395" cy="300" r="8"/><circle cx="470" cy="340" r="7"/><circle cx="525" cy="250" r="8"/><circle cx="610" cy="235" r="7"/><circle cx="650" cy="310" r="8"/><circle cx="720" cy="280" r="7"/><circle cx="355" cy="410" r="8"/><circle cx="735" cy="430" r="8"/>
    <path d="M400 300q18-32 31-2q-18 18-31 2zM525 250q18-32 31-2q-18 18-31 2zM650 310q18-32 31-2q-18 18-31 2zM735 430q18-32 31-2q-18 18-31 2z"/>
  </g>
  <!-- subtle steam -->
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".32">
    <path d="M430 145q-28-38 5-66q30-27 2-57"/><path d="M575 135q-28-38 5-66q30-27 2-57"/><path d="M710 140q-28-38 5-66q30-27 2-57"/>
  </g>
</svg>
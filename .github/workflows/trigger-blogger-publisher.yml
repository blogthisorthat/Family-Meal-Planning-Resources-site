name: Trigger Blogger Publisher

on:
  push:
    branches:
      - main
    paths:
      - blogger-publisher/queue/current.json

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger publisher and verify recipe image
        shell: bash
        run: |
          set -euo pipefail

          queue_json="$(curl --fail --silent --show-error --location --max-time 30 'https://raw.githubusercontent.com/blogthisorthat/Family-Meal-Planning-Resources-site/main/blogger-publisher/queue/current.json')"
          image_url="$(printf '%s' "$queue_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("imageUrl", ""))')"
          image_type="$(printf '%s' "$queue_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("imageType", ""))')"

          test -n "$image_url"

          case "$image_url" in
            *.jpg|*.jpeg|*.png|*.webp) ;;
            *) echo 'Recipe image must be a raster JPG, JPEG, PNG, or WEBP URL.' >&2; exit 1 ;;
          esac

          if [ -n "$image_type" ]; then
            case "$image_type" in
              image/jpeg|image/png|image/webp) ;;
              *) echo "Unsupported imageType: $image_type" >&2; exit 1 ;;
            esac
          fi

          response="$(curl --fail --silent --show-error --location --max-time 30 'https://steep-math-9b6b.conradrensch1.workers.dev/run')"
          echo "$response"
          echo "$response" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'

          post_url="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url", ""))')"
          test -n "$post_url"

          curl --fail --silent --show-error --location --max-time 30 -o /tmp/post.html "$post_url"
          grep -Fq "$image_url" /tmp/post.html

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 45 \
            -A 'Mozilla/5.0 (compatible; TheManThatCooksImageCheck/1.0)' \
            -o /tmp/recipe-image "$image_url"
          test -s /tmp/recipe-image

          echo "VERIFIED_POST_URL=$post_url"
          echo "VERIFIED_IMAGE_URL=$image_url"

name: Trigger Blogger Publisher

on:
  push:
    branches:
      - main
    paths:
      - blogger-publisher/queue/current.json
      - blogger-publisher/staging/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: man-that-cooks-blogger-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QUEUE_PATH: blogger-publisher/queue/current.json
      PUBLISH_STATE_PATH: blogger-publisher/state/last-publish.json
      WORKER_BASE: https://steep-math-9b6b.conradrensch1.workers.dev
      R2_PUBLIC_BASE: https://pub-343f7a8e174e49de9b9c66bc76af0229.r2.dev
      PUBLISH_BRANCH: main
      PUBLISH_API_KEY: ${{ secrets.PUBLISH_API_KEY }}

    steps:
      - name: Check out the publishing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble the exact generated raster image
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          python3 blogger-publisher/assemble_staged_image.py

      - name: Commit the staged raster image
        if: steps.assemble.outputs.assembled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A blogger-publisher/queue/current.json blogger-publisher/staging blogger-publisher/image-parts
          git commit -m "Assemble generated recipe image for ${{ steps.assemble.outputs.queue_id }} [skip ci]"
          git push origin HEAD:main

      - name: Wait for the staged raster image to be publicly readable
        if: steps.assemble.outputs.assembled == 'true'
        shell: bash
        env:
          IMAGE_PATH: ${{ steps.assemble.outputs.image_path }}
          EXPECTED_SHA256: ${{ steps.assemble.outputs.sha256 }}
        run: |
          set -euo pipefail
          image_url="https://raw.githubusercontent.com/blogthisorthat/Family-Meal-Planning-Resources-site/main/${IMAGE_PATH}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 45 \
              -A 'TheManThatCooksImageStageCheck/2.0' \
              -o /tmp/staged-recipe-image "${image_url}?t=$(date +%s)-${attempt}"; then
              actual="$(sha256sum /tmp/staged-recipe-image | awk '{print $1}')"
              if [ "$actual" = "$EXPECTED_SHA256" ]; then
                echo 'Staged generated image is live and byte-for-byte verified.'
                exit 0
              fi
            fi
            sleep $((attempt * 2))
          done
          echo 'Staged generated image did not become publicly readable in time.' >&2
          exit 1

      - name: Validate and prepare the generated recipe image
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 blogger-publisher/publisher_pipeline.py prepare

      - name: Commit the ready queue after image verification
        if: steps.prepare.outputs.queue_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blogger-publisher/queue/current.json
          git commit -m "Prepare generated recipe image and enable Blogger queue [skip ci]"
          git push origin HEAD:main

      - name: Wait for the updated queue to be publicly readable
        if: steps.prepare.outputs.queue_changed == 'true'
        shell: bash
        env:
          EXPECTED_QUEUE_ID: ${{ steps.prepare.outputs.queue_id }}
          EXPECTED_IMAGE_URL: ${{ steps.prepare.outputs.image_url }}
        run: |
          set -euo pipefail
          queue_url='https://raw.githubusercontent.com/blogthisorthat/Family-Meal-Planning-Resources-site/main/blogger-publisher/queue/current.json'
          for attempt in $(seq 1 12); do
            remote="$(curl --fail --silent --show-error --location --max-time 30 "${queue_url}?t=$(date +%s)-${attempt}" || true)"
            if [ -n "$remote" ] && printf '%s' "$remote" | python3 -c 'import json,os,sys; item=json.load(sys.stdin); ok=(item.get("queueId")==os.environ["EXPECTED_QUEUE_ID"] and item.get("imageUrl")==os.environ["EXPECTED_IMAGE_URL"] and item.get("imageStatus")=="ready" and item.get("enabled") is True); raise SystemExit(0 if ok else 1)'; then
              echo 'Updated queue is live.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Updated queue did not become publicly readable in time.' >&2
          exit 1

      - name: Publish through the Cloudflare Worker and verify the result
        id: publish
        if: steps.prepare.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 blogger-publisher/publisher_pipeline.py publish

      - name: Record the latest publishing result
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.publish.outcome }}
          QUEUE_ID: ${{ steps.prepare.outputs.queue_id }}
          IMAGE_URL: ${{ steps.prepare.outputs.image_url }}
          IMAGE_STORAGE: ${{ steps.prepare.outputs.image_storage }}
          PUBLISH_ACTION: ${{ steps.publish.outputs.publish_action }}
          POST_URL: ${{ steps.publish.outputs.post_url }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PUBLISH_STATE_PATH")"
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          queue_path = Path(os.environ['QUEUE_PATH'])
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          outcome = os.environ.get('STEP_OUTCOME', '')
          action = os.environ.get('PUBLISH_ACTION', '')
          state = {
              'recordedAt': dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'ok': outcome == 'success',
              'workflowOutcome': outcome or 'not-run',
              'queueId': os.environ.get('QUEUE_ID') or queue.get('queueId'),
              'title': queue.get('title'),
              'primarySeoTarget': queue.get('primarySeoTarget'),
              'publishAction': action or 'none',
              'postUrl': os.environ.get('POST_URL') or None,
              'imageUrl': os.environ.get('IMAGE_URL') or queue.get('imageUrl'),
              'imageStorage': os.environ.get('IMAGE_STORAGE') or queue.get('imageStorage'),
              'imageStatus': queue.get('imageStatus'),
          }
          Path(os.environ['PUBLISH_STATE_PATH']).write_text(
              json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit the publishing result for verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$PUBLISH_STATE_PATH" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PUBLISH_STATE_PATH"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Blogger publishing result [skip ci]"
          git push origin HEAD:main

      - name: Publishing summary
        if: always()
        shell: bash
        run: |
          {
            echo '### The Man That Cooks Sometimes'
            echo "- Queue ID: ${{ steps.prepare.outputs.queue_id }}"
            echo "- Image storage: ${{ steps.prepare.outputs.image_storage }}"
            echo "- Image URL: ${{ steps.prepare.outputs.image_url }}"
            echo "- Publish action: ${{ steps.publish.outputs.publish_action }}"
            echo "- Post URL: ${{ steps.publish.outputs.post_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
